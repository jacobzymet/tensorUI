[package]
name = "tensor"
version = "0.5.0"
edition = "2024"
description = "Tensor — a local, lightweight, open source LLM harness for humanity"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chromiumoxide = "0.9"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4.3"
pdf-extract = "0.12"
portable-pty = "0.9"
rfd = "0.17"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
tempfile = "3.23"
toml = "0.9"
tao = "0.37"
wry = "0.57"
zeroize = { version = "1.9.0", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dom_smoothie = "0.18.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "query", "form", "stream", "blocking", "gzip", "brotli", "deflate", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "query", "form", "stream", "blocking", "gzip", "brotli", "deflate", "cookies"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSString",
] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[patch.crates-io]
# GTK3 requires 0.18; backport upstream gtk-rs-core#1343 (RUSTSEC-2024-0429).
glib = { path = "vendor/glib" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
