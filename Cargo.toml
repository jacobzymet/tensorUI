[package]
name = "tensorui"
version = "0.4.0"
edition = "2024"
description = "TensorMI Harness — a local, lightweight, open source LLM harness for humanity"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = "0.3"
getrandom = "0.4.3"
pdf-extract = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking", "gzip", "brotli", "deflate", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util"] }
toml = "0.9"
tao = "0.37"
wry = "0.56"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
