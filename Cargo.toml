[package]
name = "tensorui"
version = "0.1.0"
edition = "2024"
description = "tensorUI — a local chat UI for LLM APIs with agent capabilities"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-util = "0.3"
getrandom = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
toml = "0.9"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
