name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Match tag to package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tensorui") | .version')"
          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match Cargo.toml version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: [verify, validate-version]
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          # Drop Rust's placeholder vendor ("unknown") from Linux archive names.
          ASSET_TARGET="${TARGET/-unknown-/-}"
          ARCHIVE="${{ matrix.archive }}"
          BIN_NAME="tensorui"
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXT=".exe"
          fi
          SRC="target/${TARGET}/release/${BIN_NAME}${EXT}"
          STAGING_NAME="${BIN_NAME}-${VERSION}-${ASSET_TARGET}"
          mkdir -p "dist/${STAGING_NAME}"
          cp "${SRC}" "dist/${STAGING_NAME}/"
          cp README.md "dist/${STAGING_NAME}/"
          ASSET_NAME="${STAGING_NAME}.${ARCHIVE}"
          if [[ "${ARCHIVE}" == "zip" ]]; then
            # GNU tar's -a does not create real ZIP files (Windows Explorer rejects them).
            # Use PowerShell so the asset is a proper ZIP.
            rm -f "dist/${ASSET_NAME}"
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path 'dist/${STAGING_NAME}' -DestinationPath 'dist/${ASSET_NAME}' -Force"
          else
            tar -czf "dist/${ASSET_NAME}" -C dist "${STAGING_NAME}"
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tensorui-${{ matrix.target }}
          path: dist/tensorui-*.${{ matrix.archive }}
          if-no-files-found: error

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tensorui-*.${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum tensorui-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true
          files: artifacts/*
