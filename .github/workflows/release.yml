name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          # Drop Rust's placeholder vendor ("unknown") from Linux archive names.
          ASSET_TARGET="${TARGET/-unknown-/-}"
          ARCHIVE="${{ matrix.archive }}"
          BIN_NAME="tensorui"
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXT=".exe"
          fi
          SRC="target/${TARGET}/release/${BIN_NAME}${EXT}"
          STAGING_NAME="${BIN_NAME}-${VERSION}-${ASSET_TARGET}"
          mkdir -p "dist/${STAGING_NAME}"
          cp "${SRC}" "dist/${STAGING_NAME}/"
          cp README.md "dist/${STAGING_NAME}/"
          ASSET_NAME="${STAGING_NAME}.${ARCHIVE}"
          if [[ "${ARCHIVE}" == "zip" ]]; then
            # GNU tar's -a does not create real ZIP files (Windows Explorer rejects them).
            # Use PowerShell so the asset is a proper ZIP.
            rm -f "dist/${ASSET_NAME}"
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path 'dist/${STAGING_NAME}' -DestinationPath 'dist/${ASSET_NAME}' -Force"
          else
            tar -czf "dist/${ASSET_NAME}" -C dist "${STAGING_NAME}"
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tensorui-${{ matrix.target }}
          path: dist/tensorui-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
